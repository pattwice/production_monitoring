services:
  api:
    build: .
    container_name: api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      auth_db:
        condition: service_healthy
      production_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  # Authentication Database
  auth_db:
    image: postgres:16-alpine # Pinned to a specific version
    container_name: auth_db
    environment:
      # Secrets are now referenced from the .env file
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  # Production Monitoring Database
  production_db:
    image: postgres:16-alpine # Pinned to a specific version
    container_name: production_db
    environment:
      # Secrets are now referenced from the .env file
      POSTGRES_USER: ${PROD_DB_USER}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
      POSTGRES_DB: ${PROD_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER} -d ${PROD_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  # PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest # :latest is acceptable for a dev tool
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LOAD_SERVERS: "True"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on:
      - auth_db
      - production_db
    restart: unless-stopped
    networks:
      - app_network

volumes:
  auth_data:
  production_data:

networks:
  app_network:
    driver: bridge